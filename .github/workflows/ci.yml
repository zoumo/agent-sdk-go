name: Offline SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      # No account, API key, real Codex binary, or live model is used by this job.
      RUN_REAL_CODEX_TESTS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: true
      - name: Verify the toolchain and dependencies
        run: |
          test "$(go env GOVERSION)" = "go1.26.9"
          go mod download
          go mod verify
      - name: Unit and mock contract tests
        run: go test -count=1 ./...
      - name: Race-detector tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check protocol inventory and whitespace
        run: |
          python3 docs/protocol/verify_inventory.py
          git diff --check
