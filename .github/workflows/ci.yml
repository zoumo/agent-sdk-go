name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline (${{ matrix.os }}, Go 1.26)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GORACE: 'atexit_sleep_ms=0'
      GOMAXPROCS: '2'
      PYTHON: python3
      CODEX_E2E_STDIO: '0'
      CODEX_E2E_INTERACTIONS: '0'
      CODEX_E2E_WEBSOCKET: '0'
      CLAUDE_E2E: '0'
      SDK_REAL_AGENT_E2E: '0'
    steps:
      - name: Check out complete imported history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Verify source ancestry and dependencies
        run: |
          go version
          python3 --version
          git merge-base --is-ancestor 0719539580dce97726aba7ddb56c7c6ae0c24362 HEAD
          git merge-base --is-ancestor 72041470958a0d9f2f8e6ff5c0086a66ef193745 HEAD
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Install golangci-lint 2.x
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check formatting and lint
        run: |
          make fmt-check
          make lint
      - name: Check committed whitespace
        run: |
          python3 codex/scripts/check_whitespace.py
      - name: Require an actually available external tool
        # No release is published. This intentionally fails closed until a real
        # version in scripts/agent-sdk-testify-version.json can be installed.
        run: bash scripts/with-agent-sdk-testify.sh true
      - name: Build SDK-owned runner and driver
        run: GOPROXY=off GOSUMDB=off bash scripts/simulation.sh build
      - name: Native schemas, simulation tooling, integration tests and examples
        run: bash scripts/check-offline.sh
      - name: Race tests (real-agent E2E tests visibly skip)
        if: ${{ !cancelled() }}
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: go test -race -p=1 -v -count=1 -timeout 600s ./...
      - name: Vet
        if: ${{ !cancelled() }}
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: go vet ./...
      - name: Report validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Offline validation only
          Linux/macOS native unit/subprocess contracts, schemas/inventories, data-package
          independence, simulation tooling, synthetic integration checks, examples, race and vet are separate gates.
          All real agent/model tests are **SKIPPED**. Catalog availability and offline
          checks do not establish any successful real recording.
          Fixed real-recording simulation coverage is required and fails closed
          when reviewed samples are missing. It never falls back to real agents.
          SUMMARY
      - name: Preserve simulation coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulation-${{ matrix.os }}
          path: .artifacts/simulation/gates/
          if-no-files-found: warn

  consumer:
    name: External consumer (${{ matrix.os }}, pushed commit)
    # Same-repository PR heads are published module revisions; merge SHAs and
    # fork-only commits are not assumed retrievable from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOMAXPROCS: '2'
      SDK_CONSUMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Retrieve exact remote commit into independent consumers
        run: |
          bash scripts/check-consumers.sh "$SDK_CONSUMER_SHA"
          bash claude/scripts/check-managed-consumer.sh "$SDK_CONSUMER_SHA"
      - name: Report external validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## External consumers
          Consumers retrieve the pushed repository commit and dependencies over
          the network into temporary modules with no replace or go.work.
          Four public imports, public examples and documentation snippets compile.
          Runtime checks use only synthetic data; no real CLI or model is invoked.
          Same-repository PRs fetch their published head SHA; synthetic PR merge
          commits and fork-only heads are outside this remote retrieval gate.
          SUMMARY
