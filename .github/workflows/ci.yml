name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline (${{ matrix.os }}, Go 1.26.9)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GORACE: 'atexit_sleep_ms=0'
      GOMAXPROCS: '2'
      CODEX_E2E_STDIO: '0'
      CODEX_E2E_INTERACTIONS: '0'
      CODEX_E2E_WEBSOCKET: '0'
      CLAUDE_E2E: '0'
      SDK_REAL_AGENT_E2E: '0'
    steps:
      - name: Check out complete imported history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the mise-managed pinned compiler
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install the pinned generator interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.13'
          check-latest: false
      - name: Verify compiler, source ancestry and dependencies
        run: |
          test "$(mise exec -- go env GOVERSION)" = go1.26.9
          git merge-base --is-ancestor 0719539580dce97726aba7ddb56c7c6ae0c24362 HEAD
          git merge-base --is-ancestor 72041470958a0d9f2f8e6ff5c0086a66ef193745 HEAD
          mise exec -- go mod download
          mise exec -- go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Check committed whitespace and Go formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 codex/scripts/check_whitespace.py
          mise exec -- bash claude/scripts/check-changes.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Build the Go protocol peer from this checkout
        run: |
          GOPROXY=off GOSUMDB=off mise exec -- go build -o "$RUNNER_TEMP/agent-mock" ./tools/agent-mock
          "$RUNNER_TEMP/agent-mock" version
          echo "AGENT_MOCK_BIN=$RUNNER_TEMP/agent-mock" >> "$GITHUB_ENV"
      - name: Native schemas, simulation tooling, integration tests and examples
        run: mise exec -- bash scripts/check-offline.sh
      - name: Independently installed record-user-story package
        run: |
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/record-user-story-wheel" ./tools/record-user-story
          python3 scripts/check-agent-mock-package.py "$RUNNER_TEMP"/record-user-story-wheel/record_user_story-*.whl
      - name: Race tests (real-agent E2E tests visibly skip)
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: mise exec -- go test -race -p=1 -v -count=1 -timeout 300s ./...
      - name: Vet
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: mise exec -- go vet ./...
      - name: Report validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Offline validation only
          Linux/macOS native unit/subprocess contracts, schemas/inventories, data-package
          independence, simulation tooling, synthetic integration checks, examples, race and vet are separate gates.
          All real agent/model tests are **SKIPPED**. Catalog availability and offline
          checks do not establish any successful real recording.
          SUMMARY

  consumer:
    name: External consumer (${{ matrix.os }}, pushed commit)
    # Same-repository PR heads are published module revisions; merge SHAs and
    # fork-only commits are not assumed retrievable from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOMAXPROCS: '2'
      SDK_CONSUMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the mise-managed pinned compiler
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install the pinned generator interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.13'
          check-latest: false
      - name: Retrieve exact remote commit into independent consumers
        run: |
          mise exec -- bash scripts/check-consumers.sh "$SDK_CONSUMER_SHA"
          mise exec -- bash claude/scripts/check-managed-consumer.sh "$SDK_CONSUMER_SHA"
      - name: Report external validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## External consumers
          Consumers retrieve the pushed repository commit and dependencies over
          the network into temporary modules with no replace or go.work.
          Four public imports, public examples and documentation snippets compile.
          Runtime checks use only synthetic data; no real CLI or model is invoked.
          Same-repository PRs fetch their published head SHA; synthetic PR merge
          commits and fork-only heads are outside this remote retrieval gate.
          SUMMARY
