name: Offline SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline (${{ matrix.os }}, Go 1.26.9)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      # These are the actual live harness switches. Never spend live budget in CI.
      RUN_MAC_STDIO_LIVE: "0"
      RUN_MAC_INTERACTIONS_LIVE: "0"
      RUN_MAC_WEBSOCKET_LIVE: "0"
      SDK_REAL_AGENT_E2E: "0"
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: true
      - name: Install the pinned generator interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.13'
          check-latest: false
      - name: Verify the toolchain and dependencies
        run: |
          test "$(go env GOVERSION)" = "go1.26.9"
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Check changed whitespace
        run: python3 scripts/check_whitespace.py
      - name: Verify CI gate edge cases and negative fixtures
        run: python3 -m unittest discover -s scripts -p 'test_ci_checks.py' -v
      - name: Check protocol inventory and reproducible generation
        run: |
          python3 docs/protocol/verify_inventory.py
          bash scripts/check_generated.sh
      - name: Validate recorded fixture publication and live guards
        run: |
          python3 -m unittest discover -s scripts -p 'test_recording_sanitize.py' -v
          python3 scripts/check_recordings.py
      - name: Unit and mock contract tests (live tests visibly skip)
        run: go test -v -count=1 ./...
      - name: Compile and run the offline public consumer
        run: go run ./examples/publicconsumer
      - name: Run the offline managed subscription example
        run: go run ./examples/observe-tree-offline
      - name: Replay real sanitized transcripts offline
        run: go run ./examples/replay-recorded
      - name: Race-detector tests (live tests visibly skip)
        run: go test -race -v -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Report offline scope
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Offline validation only
          Unit, mock contracts, protocol, race, vet, modules, whitespace and regeneration
          are separate gates; inspect their step results for pass/fail.
          Real CLI/account/model scenarios are **SKIPPED**, not live passes:
          - `RUN_MAC_STDIO_LIVE=0`
          - `RUN_MAC_INTERACTIONS_LIVE=0`
          - `RUN_MAC_WEBSOCKET_LIVE=0`
          Regeneration uses the checked-in schema; it does not reverify upstream provenance.
          SUMMARY
