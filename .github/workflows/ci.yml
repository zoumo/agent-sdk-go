name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOENV: 'off'
  GORACE: 'atexit_sleep_ms=0'
  GOMAXPROCS: '2'
  PYTHON: python3
  CODEX_E2E_STDIO: '0'
  CODEX_E2E_INTERACTIONS: '0'
  CODEX_E2E_WEBSOCKET: '0'
  CLAUDE_E2E: '0'
  SDK_REAL_AGENT_E2E: '0'

jobs:
  checks:
    name: ubuntu-24.04 / checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete imported history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install pinned golangci-lint
        env:
          GOLANGCI_LINT_VERSION: '2.12.2'
        run: |
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-$(go env GOOS)-$(go env GOARCH).tar.gz"
          release="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          cd "$(mktemp -d "$RUNNER_TEMP/golangci-lint.XXXXXXXX")"
          curl --fail --silent --show-error --location --retry 3 "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive' checksums.txt > "$archive.sha256"
          test -s "$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive" --strip-components=1 "${archive%.tar.gz}/golangci-lint"
          ./golangci-lint version
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Download Go dependencies
        run: go mod download
      - name: Verify source ancestry and module files
        run: |
          go version
          python3 --version
          git merge-base --is-ancestor 0719539580dce97726aba7ddb56c7c6ae0c24362 HEAD
          git merge-base --is-ancestor 72041470958a0d9f2f8e6ff5c0086a66ef193745 HEAD
          git diff --exit-code -- go.mod go.sum
      - name: Check committed whitespace
        run: python3 codex/scripts/check_whitespace.py
      - name: Validate offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          make fmt-check
          make lint
          bash scripts/check-offline.sh checks
      - name: Report validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Offline checks
          Linux native unit/subprocess contracts, schemas/inventories, data-package
          independence, simulation tooling, synthetic integration checks, examples and vet.
          All real agent/model tests are **SKIPPED**. Catalog availability and offline
          checks do not establish any successful real recording.
          SUMMARY

  race:
    name: ubuntu-24.04 / race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Download Go dependencies
        run: go mod download
      - name: Run race detector
        run: bash scripts/check-offline.sh race

  e2e:
    name: ubuntu-24.04 / simulation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Download Go dependencies
        run: go mod download
      - name: Run required recording gate
        run: bash scripts/check-offline.sh e2e
      - name: Report validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Fixed simulation gate
          This job runs reviewed real-recording replay through the SDK simulation
          runner and driver. Missing trusted inputs fail closed. It never records,
          launches a real agent, or falls back to one.
          SUMMARY
      - name: Preserve simulation coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-ubuntu-24.04
          path: .artifacts/simulation/gates/
          if-no-files-found: warn

  consumer:
    name: External consumer (pushed commit)
    # Same-repository PR heads are published module revisions; merge SHAs and
    # fork-only commits are not assumed retrievable from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SDK_CONSUMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Retrieve exact remote commit into independent consumers
        run: |
          bash scripts/check-consumers.sh "$SDK_CONSUMER_SHA"
          bash claude/scripts/check-managed-consumer.sh "$SDK_CONSUMER_SHA"
      - name: Report external validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## External consumers
          Consumers retrieve the pushed repository commit and dependencies over
          the network into temporary modules with no replace or go.work.
          Four public imports, public examples and documentation snippets compile.
          Runtime checks use only synthetic data; no real CLI or model is invoked.
          Same-repository PRs fetch their published head SHA; synthetic PR merge
          commits and fork-only heads are outside this remote retrieval gate.
          SUMMARY
