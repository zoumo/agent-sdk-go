name: Offline platform validation

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [quality, test, race, e2e, build]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GORACE: 'atexit_sleep_ms=0'
      GOMAXPROCS: '2'
      PYTHON: python3
      CODEX_E2E_STDIO: '0'
      CODEX_E2E_INTERACTIONS: '0'
      CODEX_E2E_WEBSOCKET: '0'
      CLAUDE_E2E: '0'
      SDK_REAL_AGENT_E2E: '0'
    steps:
      - name: Check out complete imported history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install ripgrep for test and quality checks
        if: ${{ matrix.task == 'quality' || matrix.task == 'test' || matrix.task == 'race' }}
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install ripgrep
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Install pinned golangci-lint
        if: ${{ matrix.task == 'quality' }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Download Go dependencies
        run: go mod download
      - name: Verify source ancestry and module files
        if: ${{ matrix.task == 'quality' }}
        run: |
          go version
          python3 --version
          git merge-base --is-ancestor 0719539580dce97726aba7ddb56c7c6ae0c24362 HEAD
          git merge-base --is-ancestor 72041470958a0d9f2f8e6ff5c0086a66ef193745 HEAD
          git diff --exit-code -- go.mod go.sum
      - name: Check committed whitespace
        if: ${{ matrix.task == 'quality' }}
        run: python3 codex/scripts/check_whitespace.py
      - name: Validate offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          if [[ "${{ matrix.task }}" == "quality" ]]; then
            make fmt-check
            make lint
          fi
          bash scripts/check-offline.sh "${{ matrix.task }}"
      - name: Report validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Offline validation only
          Linux/macOS native unit/subprocess contracts, schemas/inventories, data-package
          independence, simulation tooling, synthetic integration checks, examples, race and vet are separate gates.
          All real agent/model tests are **SKIPPED**. Catalog availability and offline
          checks do not establish any successful real recording.
          Fixed real-recording simulation coverage is required and fails closed
          when reviewed samples are missing. It never falls back to real agents.
          SUMMARY
      - name: Preserve simulation coverage and diagnostics
        if: always() && matrix.task == 'e2e'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-${{ inputs.runner }}-${{ matrix.task }}
          path: .artifacts/simulation/gates/
          if-no-files-found: warn

  required:
    name: required
    if: always()
    needs: validate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Require every task on this platform
        env:
          TASKS: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          echo "tasks: ${TASKS}"
          test "${TASKS}" = success
