name: SDK release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOENV: 'off'

jobs:
  native:
    name: Replay distribution / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: darwin-amd64, runner: macos-15-intel}
          - {target: darwin-arm64, runner: macos-15}
    uses: ./.github/workflows/replay-package.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}

  consumer:
    name: Replay external consumer / SDK tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Verify the tagged Go module and CLI install
        env:
          GONOPROXY: github.com/zoumo/agent-sdk-go
        run: make replay-check-consumer SDK_TAG="$GITHUB_REF_NAME"

  publish:
    needs: [native, consumer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: '*-*64'
          path: ${{ runner.temp }}/platforms
      - name: Collect and verify release assets
        run: |
          python3 scripts/replay/release.py --tag "$GITHUB_REF_NAME" \
            --collect "$RUNNER_TEMP/platforms" --output "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
      - name: Publish the verified SDK tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          options=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${options[@]}"
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets,url
