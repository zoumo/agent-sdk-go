name: Replay package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      target:
        description: Native OS-ARCH distribution to test
        type: string
        default: linux-amd64
      runner:
        description: Runner label for the platform
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: replay-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.target }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOENV: 'off'

jobs:
  package:
    name: Replay distribution / ${{ inputs.target || 'linux-amd64' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: replay/drivers/claude/typescript/package-lock.json
      - name: Prepare pinned build inputs
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)-$(go env GOHOSTARCH)" = '${{ inputs.target || 'linux-amd64' }}'
          go mod download
          npm ci --prefix replay/drivers/claude/typescript --ignore-scripts --omit=optional --no-audit --no-fund
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
          fi
          rustup toolchain install 1.99.1 --profile minimal
          bash replay/drivers/codex/rust/install.sh "$RUNNER_TEMP/codex-fetch" --fetch
          mv "$RUNNER_TEMP/codex-fetch/codex.tar.gz" "$RUNNER_TEMP/codex-source.tar.gz"
          rm -rf "$RUNNER_TEMP/codex-fetch"
          echo "CODEX_SOURCE_ARCHIVE=$RUNNER_TEMP/codex-source.tar.gz" >> "$GITHUB_ENV"
      - name: Build and check installed packages offline
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            make replay-release OUTPUT="$RUNNER_TEMP/replay-release" SDK_TAG="$GITHUB_REF_NAME"
          else
            python3 scripts/replay/release.py --allow-untagged --output "$RUNNER_TEMP/replay-release"
          fi
          make replay-check-package OUTPUT="$RUNNER_TEMP/replay-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: ${{ inputs.target || 'linux-amd64' }}
          path: ${{ runner.temp }}/replay-release
          if-no-files-found: error
