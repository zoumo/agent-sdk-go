[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "record-user-story"
version = "0.1.0"
description = "Official SDK story recording with the Go agent-mock tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex==0.161.0"]
claude = ["claude-agent-sdk==0.2.174"]
recording = ["openai-codex==0.161.0", "claude-agent-sdk==0.2.174"]

[project.scripts]
record-user-story = "record_user_story.cli:main"

[tool.setuptools.packages.find]
include = ["record_user_story*"]

[tool.setuptools.package-data]
record_user_story = ["schemas/*.json", "examples/*.json", "examples/bindings/*.json"]
