[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sdk-protocol-recording"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai-codex==0.161.0", "claude-agent-sdk==0.2.174"]

[project.scripts]
agent-recording = "agent_recording.cli:main"

[tool.setuptools.packages.find]
include = ["agent_recording*"]

[tool.setuptools.data-files]
"share/agent-sdk-protocol-recording/scenarios" = ["scenarios/*.json"]
"share/agent-sdk-protocol-recording/scenarios/bindings" = ["scenarios/bindings/*.json"]
